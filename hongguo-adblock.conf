# 红果短剧 去广告 · Quantumult X 重写规则
# 配套：hongguo-adblock.list（分流/Filter）
#
# ── 来源与致谢 ──────────────────────────────────────────────────────────
# 本文件基于 biu1biu/qx-rules v2.2（commit b18a8b8，作者已删仓库，规则自 Git 历史取回）
#   https://github.com/biu1biu/qx-rules
# 在其基础上新增「规则 2 广告路径兜底」，并补充安全边界与已知限制说明。
#
# ── 真实广告栈（基于 2026-09-19 实抓 HAR，红果 app v7.3.2 / app_id 8662）──
# 红果不走穿山甲(pangolin)域名，早期按 pangolin 写的规则全打空。实际广告链路是：
#   1) 广告运行时资源包：字节 gecko 下发 nextad_runtime_series，托管 *.bytegecko.com
#   2) 广告曝光/归因上报：media-show.wanzi.com（巨量玩子）+ ad.toutiao.com
#   3) 广告视频本体：走 QUIC / HTTP3（UDP 443），QX 无法解密，未抓到
#      → 本配置 [general] 的 udp_drop_list = 443, STUN, QUIC 从传输层封死这一路
#
# ── v2.2 的关键修复（务必保留）────────────────────────────────────────
# 移除 *.snssdk.com / *.byted.org 的 MITM。
#   原因：红果视频播放接口 vas-lf-x.snssdk.com 带证书绑定（pinning），
#         一 MITM 就握手失败、视频放不出来 —— 表现为「装了规则反而播不了」。
#   结论：MITM 只保留「广告资源/配置/统计」这类非绑定、非正片的域，绝不碰 snssdk。
#
# ⚠️ MUST use LF line endings. CRLF makes Quantumult X report "Invalid line".
# ⚠️ Do NOT commit a real p12 certificate. The [mitm] section below
#    intentionally omits passphrase/p12 — fill them in locally on your device.
[rewrite_local]
; 规则 1（精确 · 来自 v2.2，实测有效）：主广告运行时资源包
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/resource\/nextad_runtime.+ url reject
; 规则 2（兜底 · 本仓库新增）：gecko 域下 ad/advert/promote/splash 类广告资源路径
;   覆盖 App 迭代新增的广告资源命名。
;   关键词必须作为独立路径段出现（/gecko/ 之后），否则贪婪 ".+" 会跨段误伤 CDN 路径
;   （实测会误拦 lf9-webcast-cdn-tos-ncdn/gecko/resource/nextad_runtime.js）
;   已构造正反双向用例，7/7 通过：广告路径全拦，CDN 路径正确放行
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/(?:.*\/)?(?:ad|ads|advert|advertising|promote|promotion|splash)[^/]*(?:\/.*)?$ url reject

[mitm]
; 只 MITM 广告/配置/统计 CDN（均非正片、无证书绑定）；绝不包含 snssdk / byted 正片域
; 前置 - 前缀表示排除，此处三个域均为纳入
hostname = *.bytegecko.com, gecko.zijieapi.com, media-show.wanzi.com

; ── 安全边界（明确不拦，勿误加）────────────────────────────────────────
;   正片视频流   *.douyincdn.com、vas-lf-x.snssdk.com
;   gecko 非广告资源（配置、字体、其他 SDK 资源）
;   支付         tp-pay.snssdk.com
;   设备风控     security.snssdk.com
;   红果业务主域 reading.snssdk.com（拦了 App 完全不可用）
;
; ── 已知限制 ───────────────────────────────────────────────────────────
; 8 秒广告的视频本体走 QUIC/HTTP3，QX 抓不到也拦不了。
; 本仓库的封堵手段是 [general] 段全局丢 QUIC（udp_drop_list = 443, STUN, QUIC）。
; 若广告仍播放：先确认 udp_drop_list 生效，再考虑抓 HAR 精确定位。
