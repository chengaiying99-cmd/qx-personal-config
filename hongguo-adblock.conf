# Honguo (Red Fruit) ad-block for Quantumult X - rewrite rules
# Based on biu1biu/qx-rules v2.2 (commit b18a8b8, recovered from git history)
# Upstream: https://github.com/biu1biu/qx-rules
# Real ad stack (from upstream HAR capture, app v7.3.2):
#   gecko nextad_runtime pack (*.bytegecko.com) + media-show.wanzi.com /
#   ad.toutiao.com attribution + QUIC video body (blocked by udp_drop_list)
# NEVER MITM *.snssdk.com / *.byted.org: vas-lf-x.snssdk.com is cert-pinned,
# MITM breaks playback. Must be LF line endings (CRLF causes Invalid line).
[rewrite_local]
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/resource\/nextad_runtime.+ url reject
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/(?:.*\/)?(?:ad|ads|advert|advertising|promote|promotion|splash)[^/]*(?:\/.*)?$ url reject

[mitm]
hostname = *.bytegecko.com, gecko.zijieapi.com, media-show.wanzi.com
