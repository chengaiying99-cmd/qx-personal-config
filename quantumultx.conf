[policy]
; ═══════════════════════════════════════════════════════════
; 应用分组方案 · 从零设计（对齐 GitHub 主流分类法）
; 结构：节点层(3引擎) → 国外应用(7组) → 国内直连(1组) → 苹果(1) → 控制(3)
; 借鉴映射：AI合并←w37fhy/limbopro/saikousan ｜ 流媒体合并←saikousan/hwind2021
;           国内媒体←zqzess CMedia ｜ 国内IP←hwind ChinaASN/ChinaIPs
;           微信钉钉←w37fhy/saikousan ｜ 更新屏蔽←zqzess AppleIOSUpdate
; ═══════════════════════════════════════════════════════════

; ⚡ 自动优选：全节点持续测速（触发式），咬住延迟最低存活节点
url-latency-benchmark = ⚡ 自动优选, server-tag-regex = ^(?!.*(到期|剩余|流量|时间|官网|套餐|群|电报|TG|Telegram|客服|邀请|返利|防失联|失联)).+$, check-interval = 600, tolerance = 100, alive-checking = false, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Auto.png
; 🧠 AI固定：dest-hash 同站固定节点，出口 IP 稳定防风控（⚠️ 订阅增删节点会漂移）
dest-hash = 🧠 AI固定, server-tag-regex = ^(?!.*(到期|剩余|流量|时间|官网|套餐|群|电报|TG|Telegram|客服|邀请|返利|防失联|失联)).+$, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png
; 🌐 IPv6通道：仅 IPv6 节点，常驻测速；有延迟数字 = 当前网络 IPv6 可用
url-latency-benchmark = 🌐 IPv6通道, server-tag-regex = (?i)(ipv6|v6|六), check-interval = 600, tolerance = 100, alive-checking = true, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/Vpn.png

static = 🤖 AI服务, 🧠 AI固定, ⚡ 自动优选, direct, img-url = https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png
