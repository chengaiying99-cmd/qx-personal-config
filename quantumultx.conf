; 红果/番茄 gecko 广告运行时拦截（规则来源 biu1biu/qx-rules v2.2 + abclq，详见 README）
; 约束：[mitm] 绝不可加入 snssdk/byted 域（正片接口带证书绑定，MITM 会断流）
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/resource\/nextad_runtime.+ url reject
